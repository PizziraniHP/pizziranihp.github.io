<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Extra Saiba Mais</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --panel: #ffffff;
      --ink: #222222;
      --muted: #666666;
      --line: #ddd7ca;
      --accent: #7a2e2e;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(circle at top right, #efe8d8, var(--bg) 45%);
      line-height: 1.55;
    }

    .page {
      width: min(960px, 92vw);
      margin: 32px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    .top-links {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--muted);
    }

    .top-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .top-links a:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5b2a2a;
      border: 1px solid #d6c9b8;
      border-radius: 999px;
      background: #fff8ec;
      padding: 6px 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.1;
    }

    .lead {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      background: #faf8f3;
    }

    .item h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .item p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .item a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .item a:hover {
      text-decoration: underline;
    }
  </style>
  <script defer src="../saiba-mais/retorno.js"></script>
</head>
<body>
  <main class="page">
    <p class="top-links">
      <a href="../../elo_indice.html">voltar ao Nucleo Familiar Planejado</a>
    </p>

    <p class="badge">EXTRA SAIBA MAIS</p>
    <h1>Conteudos independentes</h1>
    <p class="lead">Paginas especiais com historias longas e galerias maiores, mantidas fora do fluxo principal de Saiba Mais.</p>

    <section class="grid" aria-label="Paginas extraordinarias">
      <article class="item">
        <h2>Vila Indaia</h2>
        <p>Mansao da familia com galeria completa de ambientes e memoria historica.</p>
        <a href="mansao-vila-indaia.html">Abrir pagina</a>
      </article>
    </section>
  </main>
</body>
</html>
