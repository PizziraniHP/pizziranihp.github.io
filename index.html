<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Reforma e Reconstrução</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #444;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
            color: #ff9900;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Estamos em Reforma</h1>
        <p>Esta página está sendo reconstruída para trazer uma nova experiência.</p>
        <p>Volte em breve para novidades.</p>

        <div class="footer">
            © 2026 — Pizzirani Construções e Reformas
        </div>
    </div>
</body>
</html>
