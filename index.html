<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Família Pizzirani</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #222;
        }

        header {
            padding: 60px 20px 40px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff, #e8ecf5);
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 2.4rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        header p {
            margin: 4px 0;
            font-size: 1rem;
            color: #555;
        }

        /* BLOCO DE BOAS-VINDAS */
        .boas-vindas {
            text-align: center;
            margin: 50px 0 60px;
        }

        .boas-vindas h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .boas-vindas h2 {
            margin: 10px 0;
            font-size: 2rem;
            font-weight: 500;
            color: #444;
        }

        main {
            max-width: 1100px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 40px;
            color: #444;
        }

        .intro p {
            margin: 6px 0;
        }

        /* AQUI VAI ENTRAR A GALERIA DA FAMÍLIA */
        .galeria-familia {
            margin-top: 40px;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #777;
            border-top: 1px solid #ddd;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Família Pizzirani</h1>
        <p>Histórias que atravessam gerações.</p>
        <p>Memórias, raízes e laços que permanecem.</p>
    </header>
